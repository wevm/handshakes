name: Pull Request
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    # A called workflow receives at most the permissions of its caller.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/verify.yml
    secrets: inherit
